[project]
name = "furniture-cli"
version = "0.1.0"
description = "Turn dimensioned IKEA furniture drawings into parametric STEP/STL models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "build123d>=0.9",
]

[project.scripts]
furniture = "furniture_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/furniture_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
